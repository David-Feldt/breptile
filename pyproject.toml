[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stl2step"
version = "0.1.0"
description = "Convert STL meshes to clean, editable STEP BREP models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Feldt" }]
keywords = ["stl", "step", "cad", "brep", "mesh", "opencascade", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "build123d>=0.8",
    "trimesh>=4.0",
    "numpy",
    "scipy",
    "manifold3d",
    "rtree",
    "networkx",
]

[project.urls]
Homepage = "https://github.com/David-Feldt/stl2step"
Issues = "https://github.com/David-Feldt/stl2step/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stl2step = "stl2step.cli:main"

[tool.setuptools.packages.find]
include = ["stl2step*"]
